[alembic]
# %(here)s = 本文件（alembic.ini）所在目录，即 backend/。
# 写成裸的 "backend/alembic" 会按当前工作目录解析：在仓库根目录下跑正常，
# 但在 backend/ 下跑就变成 backend\backend\alembic（正是 README 里
# "cd backend && pytest tests/" 的写法），导致 9 个 alembic 测试全挂。
# 用 %(here)s 之后，从根目录和从 backend/ 跑都指向同一个绝对路径。
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url 由 env.py 从 app.config 动态加载
# （生产环境使用 MySQL，测试环境使用 SQLite）

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
